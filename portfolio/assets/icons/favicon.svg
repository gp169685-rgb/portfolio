<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!--
    Favicon for Govind Patidar's portfolio.
    32×32 SVG with "GP" initials on a gradient background.
    File: assets/icons/favicon.svg
  -->

  <!-- Background rounded square -->
  <rect width="32" height="32" rx="8" fill="url(#favicon-grad)"/>

  <!-- "GP" initials -->
  <text
    x="16"
    y="22"
    text-anchor="middle"
    font-family="Poppins, system-ui, sans-serif"
    font-size="14"
    font-weight="800"
    fill="#ffffff"
    letter-spacing="-0.5"
  >GP</text>

  <!-- Gradient definition -->
  <defs>
    <linearGradient id="favicon-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
</svg>
